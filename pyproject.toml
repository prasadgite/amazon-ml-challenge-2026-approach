[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "business-entity-resolution"
version = "0.5.0"
description = "Amazon ML Challenge 2026 - Business Entity Resolution Pipeline"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "lightgbm",
    "rapidfuzz",
    "scikit-learn",
    "pandas",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]
